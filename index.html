<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shritesh — Modern React Profile Card (ApnoAI Task 2)</title>

  <!-- Modern Typography: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],

          animation: {

            'bounce-short': 'bounceShort 0.4s ease-out',

  <!-- React 18 & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 2026 Glassmorphism design system */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.08), 
                  0 0 0 1px rgba(255, 255, 255, 0.4) inset;
    }
    .dark .glass-card {

      backdrop-filter: blur(24px);

      border: 1px solid rgba(255, 255, 255, 0.08);

                  0 0 0 1px rgba(255, 255, 255, 0.06) inset;
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }
    .dark .glass-pill {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Floating particles keyframe */
    @keyframes floatUp {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx, 0px), -75px) scale(1.25);

<body class="bg-slate-50 text-slate-900 dark:bg-[#0b0f19] dark:text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-300">

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- React Component Code (Babel Script) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper: Browser Web Audio API micro-synth chime (runs without external audio files)
    const playChime = (type = 'click', isMuted = false) => {
      if (isMuted) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        if (type === 'applaud') {
          // Play a friendly warm high tone for likes
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.14); // G5
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        } else if (type === 'switch') {
          // Soft click for tabs / theme
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(330, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
        } else {
          // Default click
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        }

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.18);
      } catch (e) {
        // AudioContext ignored if blocked by autoplay policies
      }
    };

    // =========================================================================
    // 1. APP ROOT COMPONENT
    // =========================================================================
    function App() {
      // Global Theme State: controls dark mode on the whole webpage
      const [isDark, setIsDark] = useState(true);

      // Audio Mute State (State controlling micro sound effects)
      const [isMuted, setIsMuted] = useState(false);

      // Toggle dark mode class on <html> element
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      const toggleTheme = () => {
        playChime('switch', isMuted);
        setIsDark(!isDark);
      };

      const toggleMute = () => {
        setIsMuted(!isMuted);
        if (isMuted) playChime('click', false);
      };

      return (
        <div className="relative min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8 overflow-hidden font-sans">
          
          {/* Ambient Modern Mesh Gradient Background Orbs */}
          <div className="absolute top-1/4 -left-20 w-80 h-80 sm:w-96 sm:h-96 bg-purple-400/25 dark:bg-purple-600/20 rounded-full blur-3xl pointer-events-none animate-blob"></div>
          <div className="absolute top-1/3 -right-20 w-80 h-80 sm:w-96 sm:h-96 bg-indigo-400/25 dark:bg-indigo-600/20 rounded-full blur-3xl pointer-events-none animate-blob [animation-delay:2s]"></div>
          <div className="absolute -bottom-20 left-1/3 w-80 h-80 sm:w-96 sm:h-96 bg-sky-400/25 dark:bg-sky-600/20 rounded-full blur-3xl pointer-events-none animate-blob [animation-delay:4s]"></div>

          {/* ================================================================= */}
          {/* STEP 2: CUSTOMIZE YOUR DATA VIA PROPS                             */}
          {/* ================================================================= */}
          <ProfileCard
            name="Shritesh"
            role="Full-Stack Developer & AI Intern"
            company="ApnoAI"
            bio="Building modern, scalable web applications with React, TypeScript, and clean UI systems. Passionate about developer workflows, AI systems, and cloud architecture."
            skills={["React", "TypeScript", "Node.js", "Tailwind CSS", "Next.js", "Python"]}
            projects={[
              { title: "ApnoAI Task 1: Portfolio", tag: "Deployed", desc: "Live on Vercel with clean Git workflow" },
              { title: "ApnoAI Task 2: React Component", tag: "Interactive", desc: "Glassmorphism card with Props & State" },
              { title: "CivicSort Automation", tag: "AI / Dev", desc: "Automated tooling & full-stack development" }
            ]}
            badges={[
              { label: "100% Response Rate", icon: "⚡" },
              { label: "15+ Days Coding Streak", icon: "🔥" },
              { label: "React 18 & Hooks", icon: "⚛️" },
              { label: "Chai & Code Enthusiast", icon: "☕" }
            ]}
            avatar="./profile.jpg"
            avatarFallback="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80"
            location="Bengaluru, India"
            email="shritesh@civicsort.dev"
            github="https://github.com/shritesh263/Apno2"
            linkedin="https://linkedin.com"
            twitter="https://x.com"
            initialLikes={142}
            isDark={isDark}
            isMuted={isMuted}
            onToggleTheme={toggleTheme}
            onToggleMute={toggleMute}
          />

          {/* Footer note for assignment / GitHub verification */}
          <footer className="mt-8 text-center text-xs text-slate-400 dark:text-slate-500 font-mono tracking-tight flex items-center gap-2">
            <span>ApnoAI Task 2</span>
            <span>•</span>
            <span>React 18 Props & State</span>
            <span>•</span>
            <a 
              href="https://github.com/shritesh263/Apno2" 
              target="_blank" 
              rel="noreferrer" 
              className="text-indigo-500 hover:underline"
            >
              GitHub Repo
            </a>
          </footer>
        </div>
      );
    }

    // =========================================================================
    // 2. PROFILE CARD COMPONENT
    // =========================================================================
    function ProfileCard({
      name,
      role,
      company,
      bio,
      skills,
      projects,
      badges,
      avatar,
      avatarFallback,
      location,
      email,
      github,
      linkedin,
      twitter,
      initialLikes,
      isDark,
      isMuted,
      onToggleTheme,
      onToggleMute
    }) {
      // -----------------------------------------------------------------------
      // STATE HOOKS (Demonstrating React State Management)
      // -----------------------------------------------------------------------
      // 1. Bonus Like Counter (+10 XP)
      const [likes, setLikes] = useState(initialLikes || 42);
      const [hasLiked, setHasLiked] = useState(false);
      const [particles, setParticles] = useState([]);

      // 2. Tab Navigation State: 'about' | 'projects' | 'badges'
      const [activeTab, setActiveTab] = useState('about');

      // 3. Interactive Skill Tag Selection
      const [activeSkill, setActiveSkill] = useState(null);

      // 4. Contact Modal Drawer State
      const [isContactOpen, setIsContactOpen] = useState(false);
      const [quickNote, setQuickNote] = useState('');
      const [noteStatus, setNoteStatus] = useState(null);

      // 5. Toast Feedback Banner (e.g. copied link, copied email)
      const [toast, setToast] = useState(null);

      // 6. Interactive Cyclical Status Message
      const statuses = [
        "Open to collaborate",
        "Shipping Task 2 at ApnoAI 🚀",
        "Exploring React 18 & UI ⚛️",
        "Fueled by coffee & code ☕"
      ];
      const [statusIdx, setStatusIdx] = useState(0);

      // 7. Live Local Clock State (Demonstrating useEffect with setInterval & cleanup)
      const [localTime, setLocalTime] = useState("");

      useEffect(() => {
        const updateTime = () => {
          const now = new Date();
          setLocalTime(
            now.toLocaleTimeString("en-IN", {
              timeZone: "Asia/Kolkata",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: true,
            })
          );
        };
        updateTime();
        const intervalId = setInterval(updateTime, 1000);
        return () => clearInterval(intervalId); // Cleanup memory on unmount
      }, []);

      // Trigger temporary floating toast
      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 2400);
      };

      // Handle Like Button Click with Floating Heart Particles + Audio
      const handleLike = () => {
        playChime('applaud', isMuted);
        if (hasLiked) {
          setLikes(likes - 1);
          setHasLiked(false);
        } else {
          setLikes(likes + 1);
          setHasLiked(true);

          // Generate dynamic emoji particle burst
          const emojiOptions = ["❤️", "✨", "🔥", "👏", "🎉", "⚡"];
          const newParticles = Array.from({ length: 6 }).map((_, i) => ({
            id: Date.now() + i,
            emoji: emojiOptions[Math.floor(Math.random() * emojiOptions.length)],
            left: 20 + Math.random() * 60, // percentage from left
            tx: (Math.random() - 0.5) * 50, // horizontal drift in px
          }));
          setParticles(newParticles);
          setTimeout(() => setParticles([]), 1000);
        }
      };

      // Cycle Status message easter-egg
      const handleCycleStatus = () => {
        playChime('click', isMuted);
        const nextIdx = (statusIdx + 1) % statuses.length;
        setStatusIdx(nextIdx);
        showToast(`Status: "${statuses[nextIdx]}"`);
      };

      // Copy direct profile link / share
      const handleShare = () => {
        playChime('click', isMuted);
        if (navigator.clipboard) {
          navigator.clipboard.writeText(window.location.href);
          showToast("Profile link copied to clipboard! 🔗");
        }
      };

      // Quick Send Note handler in contact modal
      const handleSendNote = (e) => {
        e.preventDefault();
        if (!quickNote.trim()) return;
        playChime('applaud', isMuted);
        setNoteStatus('sent');
        setTimeout(() => {
          setNoteStatus(null);
          setQuickNote('');
          setIsContactOpen(false);
          showToast("Note delivered! Thanks for reaching out ✨");
        }, 1400);
      };

      return (
        <div className="relative w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 transition-all duration-300 hover:shadow-2xl z-10">
          
          {/* Floating Toast Notification Banner */}
          {toast && (
            <div className="absolute -top-12 left-1/2 -translate-x-1/2 px-4 py-2 rounded-2xl bg-slate-900/90 text-white dark:bg-white/90 dark:text-slate-900 text-xs font-semibold shadow-xl backdrop-blur-md animate-pop flex items-center gap-2 whitespace-nowrap z-50">
              <span>{toast}</span>
            </div>
          )}

          {/* Top Bar: Live Status & Controls (Sound, Share, Theme) */}
          <div className="flex items-center justify-between gap-2 mb-6">
            
            {/* Interactive Live Status Cycler (Click to change status!) */}
            <button
              onClick={handleCycleStatus}
              title="Click to cycle status (Interactive state!)"
              className="flex items-center gap-2 px-3 py-1.5 rounded-full glass-pill text-xs font-medium text-emerald-600 dark:text-emerald-400 hover:scale-105 active:scale-95 transition-all text-left"
            >
              <span className="relative flex h-2 w-2 flex-shrink-0">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
              </span>
              <span className="truncate max-w-[170px] sm:max-w-[210px]">{statuses[statusIdx]}</span>
            </button>

            {/* Quick Action Buttons Group */}
            <div className="flex items-center gap-1.5">
              
              {/* Sound / Mute Toggle */}
              <button
                onClick={onToggleMute}
                aria-label="Toggle Sound"
                title={isMuted ? "Unmute audio effects" : "Mute audio effects"}
                className="p-2 rounded-xl glass-pill hover:bg-white/80 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 transition-all active:scale-95 text-xs"
              >
                {isMuted ? "🔇" : "🔊"}
              </button>

              {/* Share Profile Link */}
              <button
                onClick={handleShare}
                aria-label="Share profile"
                title="Copy share link"
                className="p-2 rounded-xl glass-pill hover:bg-white/80 dark:hover:bg-white/10 text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-all active:scale-95"
              >
                <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
              </button>

              {/* Dark / Light Theme Toggle */}
              <button
                onClick={onToggleTheme}
                aria-label="Toggle theme"
                title="Toggle Dark / Light theme (useState)"
                className="p-2 rounded-xl glass-pill hover:bg-white/80 dark:hover:bg-white/10 text-slate-600 dark:text-slate-300 transition-all active:scale-95"
              >
                {isDark ? (
                  <svg className="w-3.5 h-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                ) : (
                  <svg className="w-3.5 h-3.5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                  </svg>
                )}
              </button>
            </div>
          </div>

          {/* Profile Identity Section */}
          <div className="flex flex-col items-center text-center">
            
            {/* Avatar Frame with Gradient Border Glow */}
            <div className="relative group mb-4">
              <div className="absolute -inset-1 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-full blur-sm opacity-70 group-hover:opacity-100 transition duration-300"></div>
              <img
                src={avatar}
                onError={(e) => {
                  if (avatarFallback && e.target.src !== avatarFallback) {
                    e.target.src = avatarFallback;
                  }
                }}
                alt={name}
                className="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full object-cover border-2 border-white dark:border-slate-800 shadow-xl"
              />
              <span className="absolute bottom-1 right-1 w-5 h-5 bg-indigo-600 border-2 border-white dark:border-slate-900 rounded-full flex items-center justify-center text-[10px] text-white font-bold" title="Verified Member">
                ✓
              </span>
            </div>

            {/* Name & Role */}
            <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-1">
              {name}
            </h1>
            
            <p className="text-sm font-semibold text-indigo-600 dark:text-indigo-400 mb-2">
              {role} {company && <span className="text-slate-400 dark:text-slate-500 font-normal">at {company}</span>}
            </p>

            {/* Location & Live Clock Badge (Demonstrating useEffect) */}
            <div className="flex flex-wrap items-center justify-center gap-2 text-xs text-slate-500 dark:text-slate-400 mb-4 font-medium">
              {location && (
                <div className="flex items-center gap-1">
                  <svg className="w-3.5 h-3.5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                  </svg>
                  <span>{location}</span>
                </div>
              )}
              {localTime && (
                <>
                  <span>•</span>
                  <div className="flex items-center gap-1 font-mono text-[11px] bg-slate-100 dark:bg-slate-800/60 px-2 py-0.5 rounded-md" title="Local Time in Bengaluru (IST)">
                    <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>{localTime} IST</span>
                  </div>
                </>
              )}
            </div>
          </div>

          {/* Interactive Navigation Tabs: 'about' | 'projects' | 'badges' */}
          <div className="flex items-center justify-center gap-1 p-1 rounded-2xl glass-pill mb-4 text-xs font-semibold">
            <button
              onClick={() => { playChime('switch', isMuted); setActiveTab('about'); }}
              className={`flex-1 py-1.5 rounded-xl transition-all ${
                activeTab === 'about'
                  ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                  : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
              }`}
            >
              About
            </button>
            <button
              onClick={() => { playChime('switch', isMuted); setActiveTab('projects'); }}
              className={`flex-1 py-1.5 rounded-xl transition-all ${
                activeTab === 'projects'
                  ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                  : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
              }`}
            >
              Projects
            </button>
            <button
              onClick={() => { playChime('switch', isMuted); setActiveTab('badges'); }}
              className={`flex-1 py-1.5 rounded-xl transition-all ${
                activeTab === 'badges'
                  ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                  : 'text-slate-500 hover:text-slate-900 dark:hover:text-white'
              }`}
            >
              Badges
            </button>
          </div>

          {/* Tab Content Display */}
          <div className="min-h-[120px] mb-4">
            
            {/* TAB 1: ABOUT */}
            {activeTab === 'about' && (
              <div className="space-y-4 animate-pop">
                <p className="text-sm leading-relaxed text-slate-600 dark:text-slate-300 text-center">
                  {bio}
                </p>

                {/* Skills Chips */}
                <div>
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[11px] font-semibold tracking-wider uppercase text-slate-400 dark:text-slate-500">
                      Core Stack (Click to test)
                    </span>
                    {activeSkill && (
                      <span className="text-[11px] font-mono text-indigo-500 dark:text-indigo-400">
                        active: {activeSkill}
                      </span>
                    )}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    {skills && skills.map((skill, index) => {
                      const isSelected = activeSkill === skill;
                      return (
                        <button
                          key={index}
                          onClick={() => {
                            playChime('click', isMuted);
                            setActiveSkill(isSelected ? null : skill);
                          }}
                          className={`px-2.5 py-1 rounded-xl text-xs font-medium transition-all duration-200 ${
                            isSelected
                              ? "bg-indigo-600 text-white shadow-md shadow-indigo-500/25 scale-105"
                              : "glass-pill text-slate-700 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400"
                          }`}
                        >
                          {skill}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: PROJECTS */}
            {activeTab === 'projects' && (
              <div className="space-y-2 animate-pop">
                {projects && projects.map((proj, idx) => (
                  <div key={idx} className="p-2.5 rounded-2xl glass-pill hover:border-indigo-300 dark:hover:border-indigo-500/40 transition-all flex items-center justify-between gap-2">
                    <div>
                      <h4 className="text-xs font-bold text-slate-900 dark:text-white">{proj.title}</h4>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400">{proj.desc}</p>
                    </div>
                    <span className="text-[10px] font-mono font-semibold px-2 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">
                      {proj.tag}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 3: BADGES */}
            {activeTab === 'badges' && (
              <div className="grid grid-cols-2 gap-2 animate-pop">
                {badges && badges.map((badge, idx) => (
                  <div key={idx} className="p-2.5 rounded-2xl glass-pill flex items-center gap-2 text-left">
                    <span className="text-base">{badge.icon}</span>
                    <span className="text-xs font-medium text-slate-700 dark:text-slate-300 leading-tight">
                      {badge.label}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Interactive Feature Row: Bonus Like Button & Action CTA */}
          <div className="relative flex items-center gap-3 pt-3 mb-5 border-t border-slate-200/60 dark:border-slate-800/80">
            
            {/* Dynamic Emoji Floating Particles */}
            {particles.map((p) => (
              <div
                key={p.id}
                style={{
                  left: `${p.left}%`,
                  bottom: '50px',
                  '--tx': `${p.tx}px`
                }}
                className="absolute pointer-events-none text-xl particle-float z-30"
              >
                {p.emoji}
              </div>
            ))}

            {/* BONUS FEATURE (+10 XP): Interactive Like Button with State Counter */}
            <button
              onClick={handleLike}
              className={`flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl text-sm font-semibold transition-all duration-200 transform active:scale-95 shadow-sm ${
                hasLiked
                  ? "bg-rose-500 text-white shadow-rose-500/30 shadow-lg"
                  : "glass-pill text-slate-700 dark:text-slate-200 hover:bg-rose-50 dark:hover:bg-rose-950/30 hover:text-rose-600 hover:border-rose-300"
              }`}
              title="Click to appreciate (useState + particles + audio)"
            >
              <svg
                className={`w-4 h-4 transition-transform duration-300 ${
                  hasLiked ? "scale-125 fill-current animate-bounce-short" : "stroke-current fill-none"
                }`}
                viewBox="0 0 24 24"
                strokeWidth="2"
                stroke="currentColor"
              >
                <path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
              <span>{hasLiked ? "Applauded!" : "Applaud"}</span>
              <span className={`text-xs px-2 py-0.5 rounded-full ${
                hasLiked ? "bg-white/20 text-white" : "bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400"
              }`}>
                {likes}
              </span>
            </button>

            {/* Contact Drawer Trigger Button */}
            <button
              onClick={() => { playChime('click', isMuted); setIsContactOpen(true); }}
              className="flex-1 flex items-center justify-center gap-2 py-2.5 px-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-sm font-semibold transition-all shadow-md shadow-indigo-600/25"
              title="Open contact drawer"
            >
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
              </svg>
              <span>Get in touch</span>
            </button>
          </div>

          {/* Social Links Bar */}
          <div className="flex items-center justify-center gap-3">
            {github && (
              <a
                href={github}
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub Profile"
                className="p-2.5 rounded-xl glass-pill text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-all"
              >
                <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                  <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                </svg>
              </a>
            )}

            {linkedin && (
              <a
                href={linkedin}
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn Profile"
                className="p-2.5 rounded-xl glass-pill text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-all"
              >
                <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                  <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>
              </a>
            )}

            {twitter && (
              <a
                href={twitter}
                target="_blank"
                rel="noopener noreferrer"
                aria-label="X (Twitter) Profile"
                className="p-2.5 rounded-xl glass-pill text-slate-600 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:scale-110 transition-all"
              >
                <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                  <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
              </a>
            )}
          </div>

          {/* Quick Contact Modal Drawer Overlay */}
          {isContactOpen && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 animate-pop">
              <div className="w-full max-w-sm glass-card rounded-3xl p-6 relative">
                
                {/* Close Button */}
                <button
                  onClick={() => setIsContactOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-xl glass-pill text-slate-400 hover:text-slate-900 dark:hover:text-white"
                >
                  ✕
                </button>

                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-1">
                  Get in Touch
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-4">
                  Send a quick direct note or copy email address.
                </p>

                {/* Direct Email Box */}
                <div className="p-3 rounded-2xl glass-pill flex items-center justify-between gap-2 mb-4">
                  <div className="text-xs font-mono text-slate-700 dark:text-slate-300 truncate">
                    {email}
                  </div>
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(email);
                      showToast("Email address copied! 📋");
                    }}
                    className="px-2.5 py-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-semibold"
                  >
                    Copy
                  </button>
                </div>

                {/* Quick Note Input Form */}
                <form onSubmit={handleSendNote}>
                  <textarea
                    rows="3"
                    value={quickNote}
                    onChange={(e) => setQuickNote(e.target.value)}
                    placeholder="Write a quick message or collaboration idea..."
                    className="w-full p-3 rounded-2xl glass-pill text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 mb-3 resize-none dark:text-white"
                  ></textarea>

                  <button
                    type="submit"
                    disabled={noteStatus === 'sent'}
                    className="w-full py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition-all shadow-md shadow-indigo-600/25 flex items-center justify-center gap-2"
                  >
                    {noteStatus === 'sent' ? (
                      <span>Sending... ✨</span>
                    ) : (
                      <span>Send Direct Note 🚀</span>
                    )}
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // =========================================================================
    // 3. MOUNTING TO DOM (React 18 createRoot API)
    // =========================================================================
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
